<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shooting Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      overflow: hidden;
      text-align: center;
    }

    canvas {
      background: #000;
      display: block;
      margin: 0 auto;
      border: 2px solid #fff;
      touch-action: none;
    }

    #score {
      font-size: 24px;
      margin: 10px;
    }

    .controls {
      position: fixed;
      bottom: 10px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      z-index: 1000;
    }

    .btn {
      width: 25%;
      height: 60px;
      font-size: 18px;
      background: #444;
      color: white;
      border: none;
      border-radius: 10px;
      touch-action: manipulation;
    }

    @media (min-width: 600px) {
      .controls {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <canvas id="gameCanvas" width="480" height="640"></canvas>

  <div class="controls">
    <button class="btn" id="leftBtn">⬅️</button>
    <button class="btn" id="shootBtn">🔫</button>
    <button class="btn" id="rightBtn">➡️</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let score = 0;
    const scoreDisplay = document.getElementById('score');

    // Resize canvas to fit screen
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - 100;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let keys = {};

    const player = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 60,
      width: 40,
      height: 40,
      speed: 6,
      color: 'cyan'
    };

    const bullets = [];
    const enemies = [];

    function drawPlayer() {
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function drawBullets() {
      bullets.forEach((b, i) => {
        b.y -= b.speed;
        if (b.y < 0) bullets.splice(i, 1);
        else {
          ctx.fillStyle = 'yellow';
          ctx.fillRect(b.x, b.y, b.width, b.height);
        }
      });
    }

    function drawEnemies() {
      enemies.forEach((e, i) => {
        e.y += e.speed;
        if (e.y > canvas.height) enemies.splice(i, 1);
        else {
          ctx.fillStyle = 'red';
          ctx.fillRect(e.x, e.y, e.width, e.height);
        }
      });
    }

    function detectCollisions() {
      bullets.forEach((b, bi) => {
        enemies.forEach((e, ei) => {
          if (
            b.x < e.x + e.width &&
            b.x + b.width > e.x &&
            b.y < e.y + e.height &&
            b.y + b.height > e.y
          ) {
            enemies.splice(ei, 1);
            bullets.splice(bi, 1);
            score += 10;
            scoreDisplay.textContent = `Score: ${score}`;
          }
        });
      });
    }

    function spawnEnemy() {
      const x = Math.random() * (canvas.width - 30);
      enemies.push({
        x: x,
        y: 0,
        width: 30,
        height: 30,
        speed: 2 + Math.random() * 2
      });
    }

    function shootBullet() {
      bullets.push({
        x: player.x + player.width / 2 - 2,
        y: player.y,
        width: 4,
        height: 10,
        speed: 8
      });
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
      if (keys['ArrowRight'] && player.x + player.width < canvas.width) player.x += player.speed;

      drawPlayer();
      drawBullets();
      drawEnemies();
      detectCollisions();

      requestAnimationFrame(update);
    }

    setInterval(spawnEnemy, 1000);

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === ' ' || e.key === 'Spacebar') shootBullet();
    });

    document.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    // Touch controls
    document.getElementById('leftBtn').addEventListener('touchstart', () => keys['ArrowLeft'] = true);
    document.getElementById('rightBtn').addEventListener('touchstart', () => keys['ArrowRight'] = true);
    document.getElementById('shootBtn').addEventListener('touchstart', shootBullet);
    document.getElementById('leftBtn').addEventListener('touchend', () => keys['ArrowLeft'] = false);
    document.getElementById('rightBtn').addEventListener('touchend', () => keys['ArrowRight'] = false);

    update();
  </script>
</body>
</html>
